<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infovore</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        /* FOUC prevention: apply saved theme before first paint */
        (function () {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* ---- Shell layout ---- */
        .shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ---- Tab bar ---- */
        .tab-bar {
            display: flex;
            align-items: center;
            height: 48px;
            min-height: 48px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 0 8px;
            gap: 0;
            position: relative;
            z-index: 100;
        }

        /* Hamburger button */
        .menu-trigger {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: var(--radius);
            background: transparent;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s, color 0.15s;
        }

        .menu-trigger:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        /* Tab buttons */
        .tab-group {
            display: flex;
            align-items: stretch;
            height: 100%;
            margin-left: 8px;
        }

        .tab-btn {
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.15s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--text);
        }

        .tab-btn.active {
            color: var(--text);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 8px;
            right: 8px;
            height: 2px;
            background: var(--primary);
            border-radius: 2px 2px 0 0;
        }

        /* Right-side actions */
        .tab-bar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Theme toggle */
        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: var(--radius);
            background: transparent;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s, color 0.15s;
        }

        .theme-toggle:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        /* ---- Dropdown menu ---- */
        .menu-dropdown {
            display: none;
            position: absolute;
            top: 44px;
            left: 8px;
            min-width: 180px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            z-index: 200;
            overflow: hidden;
        }

        .menu-dropdown.open {
            display: block;
        }

        .menu-dropdown-item {
            display: block;
            width: 100%;
            padding: 10px 16px;
            border: none;
            background: transparent;
            color: var(--text);
            font-family: inherit;
            font-size: 0.875rem;
            text-align: left;
            cursor: pointer;
            transition: background 0.12s;
        }

        .menu-dropdown-item:hover {
            background: var(--bg-hover);
        }

        .menu-dropdown-item:first-child {
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .menu-dropdown-item:last-child {
            border-radius: 0 0 var(--radius) var(--radius);
        }

        /* ---- Content frame ---- */
        .content-frame {
            flex: 1;
            border: none;
            width: 100%;
            display: block;
            background: var(--bg);
        }

        /* ---- Toast ---- */
        .shell-toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 20px;
            font-family: inherit;
            font-size: 0.875rem;
            color: var(--text);
            box-shadow: var(--shadow-md);
            z-index: 1000;
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
        }

        .shell-toast.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .shell-toast.success {
            border-left: 3px solid var(--success);
        }

        .shell-toast.error {
            border-left: 3px solid var(--danger);
        }

        /* ---- Progress bar ---- */
        .progress-bar-container {
            height: 3px;
            background: var(--border);
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .progress-bar-container.active {
            opacity: 1;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light), var(--primary));
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 0 2px 2px 0;
        }

        /* Indeterminate animation (for Kalshi scan where we don't know progress %) */
        .progress-bar-fill.indeterminate {
            width: 30%;
            animation: indeterminate 1.5s ease-in-out infinite;
        }

        @keyframes indeterminate {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(400%);
            }
        }

        .progress-status {
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            opacity: 0;
            overflow: hidden;
            max-height: 0;
            transition: opacity 0.3s, max-height 0.3s;
        }

        .progress-status.active {
            opacity: 1;
            max-height: 24px;
        }
    </style>
</head>

<body>
    <div class="shell">
        <!-- Tab bar -->
        <div class="tab-bar">
            <button class="menu-trigger" id="menuTrigger" aria-label="Menu" title="Menu">&#9776;</button>
            <div class="tab-group">
                <button class="tab-btn" data-tab="reader">Reader</button>
                <button class="tab-btn" data-tab="markets">Markets</button>
            </div>
            <div class="tab-bar-right">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme"></button>
            </div>
            <!-- Hamburger dropdown -->
            <div class="menu-dropdown" id="menuDropdown">
                <button class="menu-dropdown-item" id="menuSettings">Settings</button>
                <button class="menu-dropdown-item" id="menuRefreshFeeds">Refresh Feeds</button>
                <button class="menu-dropdown-item" id="menuRefreshScan">Refresh Scan</button>
            </div>
        </div>

        <!-- Progress bar -->
        <div class="progress-bar-container" id="progressBar">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="progress-status" id="progressStatus"></div>

        <!-- Single iframe for content -->
        <iframe class="content-frame" id="contentFrame" src="/"></iframe>
    </div>

    <!-- Toast -->
    <div class="shell-toast" id="shellToast"></div>

    <script>
        (function () {
            'use strict';

            /* ---- Elements ---- */
            var tabs = document.querySelectorAll('.tab-btn');
            var frame = document.getElementById('contentFrame');
            var menuTrigger = document.getElementById('menuTrigger');
            var menuDropdown = document.getElementById('menuDropdown');
            var menuSettings = document.getElementById('menuSettings');
            var menuRefreshScan = document.getElementById('menuRefreshScan');
            var menuRefreshFeeds = document.getElementById('menuRefreshFeeds');
            var themeToggle = document.getElementById('themeToggle');
            var toast = document.getElementById('shellToast');
            var progressBar = document.getElementById('progressBar');
            var progressFill = document.getElementById('progressFill');
            var progressStatus = document.getElementById('progressStatus');

            /* ---- Progress bar helpers ---- */
            var kalshiPollTimer = null;
            var rssPollTimer = null;

            function showProgress(pct, statusText, indeterminate) {
                progressBar.classList.add('active');
                progressStatus.classList.add('active');
                if (indeterminate) {
                    progressFill.className = 'progress-bar-fill indeterminate';
                    progressFill.style.width = '';
                } else {
                    progressFill.className = 'progress-bar-fill';
                    progressFill.style.width = Math.min(100, Math.max(0, pct)) + '%';
                }
                if (statusText) progressStatus.textContent = statusText;
            }

            function hideProgress() {
                progressBar.classList.remove('active');
                progressStatus.classList.remove('active');
                progressFill.className = 'progress-bar-fill';
                progressFill.style.width = '0%';
                progressStatus.textContent = '';
            }

            /* ---- Kalshi scan polling ---- */
            function startKalshiPoll() {
                if (kalshiPollTimer) return;
                showProgress(0, 'Scanning markets...', true);
                kalshiPollTimer = setInterval(function () {
                    fetch('/api/kalshi/status').then(function (r) { return r.json(); }).then(function (data) {
                        if (data.scanning) {
                            showProgress(0, 'Scanning markets...', true);
                        } else {
                            clearInterval(kalshiPollTimer);
                            kalshiPollTimer = null;
                            hideProgress();
                            if (data.last_error) {
                                showToast('Scan failed: ' + data.last_error, 'error');
                            } else {
                                showToast('Scan complete', 'success');
                                // Reload markets iframe if active
                                try {
                                    var currentPath = new URL(frame.src, location.origin).pathname;
                                    if (currentPath === '/markets') frame.src = '/markets';
                                } catch (e) { }
                            }
                        }
                    }).catch(function () { });
                }, 2000);
            }

            /* ---- RSS refresh polling ---- */
            function startRSSPoll() {
                if (rssPollTimer) return;
                showProgress(0, 'Refreshing feeds...', true);
                rssPollTimer = setInterval(function () {
                    fetch('/api/rss/status').then(function (r) { return r.json(); }).then(function (data) {
                        if (data.refreshing) {
                            var pct = data.feeds_total > 0 ? Math.round((data.feeds_done / data.feeds_total) * 100) : 0;
                            showProgress(pct, 'Refreshing feeds: ' + data.feeds_done + '/' + data.feeds_total + ' (' + data.new_items + ' new items)', false);
                        } else {
                            clearInterval(rssPollTimer);
                            rssPollTimer = null;
                            hideProgress();
                            if (data.last_error) {
                                showToast('Refresh failed: ' + data.last_error, 'error');
                            } else if (data.feeds_total > 0) {
                                showToast('Refreshed ' + data.feeds_total + ' feeds, ' + data.new_items + ' new items', 'success');
                                // Reload reader iframe if active
                                try {
                                    var currentPath = new URL(frame.src, location.origin).pathname;
                                    if (currentPath.indexOf('/reader') === 0) frame.src = frame.src;
                                } catch (e) { }
                            }
                        }
                    }).catch(function () { });
                }, 2000);
            }

            /* ---- Tab routing ---- */
            var TAB_MAP = {
                reader: '/reader',
                markets: '/markets'
            };

            function currentTheme() {
                return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            }

            function updateThemeIcon() {
                /* Moon for light mode (click to go dark), Sun for dark mode (click to go light) */
                themeToggle.textContent = currentTheme() === 'dark' ? '\u2600' : '\u263D';
            }

            function activateTab(name, pushState) {
                if (!TAB_MAP[name]) name = 'reader';
                var src = TAB_MAP[name];

                tabs.forEach(function (btn) {
                    btn.classList.toggle('active', btn.getAttribute('data-tab') === name);
                });

                /* Only reload iframe if the source actually changed */
                var currentPath;
                try {
                    currentPath = new URL(frame.src, location.origin).pathname;
                } catch (e) {
                    currentPath = '';
                }
                if (currentPath !== src) {
                    frame.src = src;
                }

                /* Persist */
                localStorage.setItem('shell-tab', name);
                if (pushState) {
                    history.replaceState(null, '', '#' + name);
                }

                /* Check for in-progress operations on tab switch */
                if (name === 'markets' && !kalshiPollTimer) {
                    fetch('/api/kalshi/status').then(function (r) { return r.json(); }).then(function (data) {
                        if (data.scanning) startKalshiPoll();
                    }).catch(function () { });
                }
                if (name === 'reader' && !rssPollTimer) {
                    fetch('/api/rss/status').then(function (r) { return r.json(); }).then(function (data) {
                        if (data.refreshing) startRSSPoll();
                    }).catch(function () { });
                }
            }

            /* Tab click handlers */
            tabs.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    activateTab(btn.getAttribute('data-tab'), true);
                });
            });

            /* Determine initial tab: hash > localStorage > default (reader) */
            function initialTab() {
                var hash = location.hash.replace('#', '');
                if (TAB_MAP[hash]) return hash;
                var saved = localStorage.getItem('shell-tab');
                if (TAB_MAP[saved]) return saved;
                return 'reader';
            }

            /* ---- Hamburger menu ---- */
            menuTrigger.addEventListener('click', function (e) {
                e.stopPropagation();
                menuDropdown.classList.toggle('open');
            });

            document.addEventListener('click', function () {
                menuDropdown.classList.remove('open');
            });

            menuDropdown.addEventListener('click', function (e) {
                e.stopPropagation();
            });

            menuSettings.addEventListener('click', function () {
                menuDropdown.classList.remove('open');
                window.location.href = '/settings';
            });

            menuRefreshScan.addEventListener('click', function () {
                menuDropdown.classList.remove('open');
                fetch('/api/kalshi/refresh', { method: 'POST' })
                    .then(function (res) {
                        if (res.ok) {
                            showToast('Scan started', 'success');
                            startKalshiPoll();
                        } else if (res.status === 409) {
                            showToast('Scan already in progress', 'error');
                            startKalshiPoll();
                        } else {
                            showToast('Failed to start scan', 'error');
                        }
                    })
                    .catch(function () {
                        showToast('Network error', 'error');
                    });
            });

            menuRefreshFeeds.addEventListener('click', function () {
                menuDropdown.classList.remove('open');
                fetch('/api/rss/refresh', { method: 'POST' })
                    .then(function (res) {
                        if (res.ok) {
                            showToast('Feed refresh started', 'success');
                            startRSSPoll();
                        } else if (res.status === 409) {
                            showToast('Feed refresh already running', 'error');
                            startRSSPoll();
                        } else {
                            showToast('Failed to start refresh', 'error');
                        }
                    })
                    .catch(function () {
                        showToast('Network error', 'error');
                    });
            });

            /* ---- Listen for messages from iframes ---- */
            window.addEventListener('message', function (e) {
                if (e.data && e.data.type === 'rss-refresh-started') {
                    startRSSPoll();
                }
            });

            /* ---- Theme toggle ---- */
            themeToggle.addEventListener('click', function () {
                var next = currentTheme() === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                updateThemeIcon();

                /* Notify iframe */
                try {
                    frame.contentWindow.postMessage({ type: 'theme-changed', value: next }, '*');
                } catch (e) { /* cross-origin guard */ }

                /* Fire-and-forget persist to DB */
                fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ theme: next })
                }).catch(function () { /* silent */ });
            });

            /* ---- Toast ---- */
            var toastTimer;

            function showToast(msg, type) {
                clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.className = 'shell-toast visible ' + (type || '');
                toastTimer = setTimeout(function () {
                    toast.classList.remove('visible');
                }, 3000);
            }

            /* ---- Hash change ---- */
            window.addEventListener('hashchange', function () {
                var hash = location.hash.replace('#', '');
                if (TAB_MAP[hash]) activateTab(hash, false);
            });

            /* ---- Init ---- */
            updateThemeIcon();
            activateTab(initialTab(), true);
        })();
    </script>
</body>

</html>
